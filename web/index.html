<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>白酒行业财报问答库</title>
  <style>
    :root { --ink:#142927; --muted:#677875; --line:#d9e3df; --paper:#f5f7f3; --card:#fff; --green:#0f766e; --dark:#123b36; --amber:#c77d23; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; }
    header { background:var(--dark); color:#fff; padding:20px 0; border-bottom:4px solid #d3a24f; }
    .wrap { width:min(1180px,calc(100% - 40px)); margin:auto; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .mark { width:42px; height:42px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.45); font-family:Georgia,serif; font-size:24px; }
    h1 { margin:0; font-size:24px; letter-spacing:.04em; font-weight:650; }
    .subtitle { margin-top:5px; color:#cbdad7; font-size:13px; }
    .status { font-size:13px; color:#d8e7e4; border:1px solid rgba(255,255,255,.25); padding:8px 12px; border-radius:999px; }
    .status::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#5ee2aa; margin-right:8px; }
    main { padding:32px 0 48px; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); background:var(--card); margin-bottom:22px; }
    .metric { padding:18px 22px; border-right:1px solid var(--line); }
    .metric:last-child { border-right:0; }
    .metric b { display:block; font-family:Georgia,"Times New Roman",serif; font-size:25px; color:var(--dark); margin-bottom:3px; }
    .metric span { color:var(--muted); font-size:12px; }
    .ask { background:var(--card); border:1px solid var(--line); padding:24px; }
    .eyebrow { font-size:11px; font-weight:700; color:var(--green); letter-spacing:.13em; text-transform:uppercase; }
    .ask h2 { font-size:25px; margin:6px 0 8px; }
    .ask p { margin:0 0 17px; color:var(--muted); font-size:14px; }
    textarea { width:100%; min-height:94px; resize:vertical; padding:15px 16px; border:1px solid #a9bbb6; background:#fbfcfa; color:var(--ink); font:16px/1.7 inherit; outline:none; }
    textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(15,118,110,.11); }
    .askbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:13px; }
    .samples { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { appearance:none; background:#edf3f0; color:#35524d; border:0; border-radius:999px; padding:7px 11px; cursor:pointer; font:12px inherit; }
    .chip:hover { background:#dae9e4; }
    .submit { appearance:none; flex:0 0 auto; border:0; background:var(--green); color:#fff; padding:12px 22px; cursor:pointer; font:600 14px inherit; }
    .submit:hover { background:#0b625c; }
    .submit:disabled { opacity:.55; cursor:wait; }
    #error { display:none; margin-top:14px; padding:12px 14px; border-left:3px solid #b63232; background:#fff1f1; color:#8b2727; font-size:13px; }
    .result { display:none; grid-template-columns:minmax(0,1.4fr) minmax(320px,.75fr); gap:20px; margin-top:20px; }
    .panel { background:var(--card); border:1px solid var(--line); }
    .panelhead { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line); }
    .panelhead h3 { margin:0; font-size:15px; }
    .mode { color:var(--green); font-size:11px; font-weight:700; }
    .answer { padding:22px; white-space:pre-wrap; font-size:15px; line-height:1.85; min-height:270px; }
    .method { margin:0 22px 22px; padding:13px 15px; background:#f3f6f4; color:#5b6e6a; font-size:12px; line-height:1.6; border-left:3px solid #85a59e; }
    .sources { max-height:560px; overflow:auto; }
    details { border-bottom:1px solid var(--line); }
    summary { cursor:pointer; list-style:none; padding:14px 16px; }
    summary::-webkit-details-marker { display:none; }
    .sourcetop { display:flex; align-items:flex-start; gap:10px; }
    .cite { flex:0 0 27px; height:27px; display:grid; place-items:center; background:var(--dark); color:#fff; font:13px Georgia,serif; }
    .sourcename { font-size:13px; line-height:1.5; font-weight:650; }
    .ranks { margin-top:4px; color:var(--muted); font-size:11px; }
    .sourcebody { padding:0 16px 16px 53px; color:#4f625e; font-size:12px; line-height:1.7; }
    .sourcebody a { color:var(--green); }
    footer { text-align:center; color:#7b8b87; font-size:11px; padding:10px 0 26px; }
    .loading { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin-right:8px; vertical-align:-2px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:820px) { .metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.result{grid-template-columns:1fr}.askbar{align-items:flex-start;flex-direction:column}.submit{width:100%}.status{display:none} }
  </style>
</head>
<body>
  <header><div class="wrap topline">
    <div class="brand"><div class="mark">报</div><div><h1>白酒行业财报问答库</h1><div class="subtitle">2025 年年报 · 混合检索 · 原文可追溯</div></div></div>
    <div class="status">语料库已就绪</div>
  </div></header>
  <main class="wrap">
    <section class="metrics">
      <div class="metric"><b>12</b><span>家 A 股白酒公司</span></div>
      <div class="metric"><b id="chunkMetric">—</b><span>个可检索文本块</span></div>
      <div class="metric"><b>512</b><span>维语义向量</span></div>
      <div class="metric"><b>2 路</b><span>Vector + BM25，RRF 融合</span></div>
    </section>
    <section class="ask">
      <div class="eyebrow">Evidence-first RAG</div>
      <h2>从年报原文，到一个可核验的答案</h2>
      <p>支持单公司数据查询、表格指标定位和多公司对比；结论后的编号可展开查看原文。</p>
      <textarea id="question">请比较贵州茅台、五粮液和泸州老窖2025年的营业收入与归母净利润，并给出出处。</textarea>
      <div class="askbar">
        <div class="samples">
          <button class="chip" data-q="贵州茅台2025年营业总收入是多少？同比变化如何？">单公司指标</button>
          <button class="chip" data-q="洋河股份2025年末合同负债余额是多少？">表格查询</button>
          <button class="chip" data-q="请比较贵州茅台、五粮液和泸州老窖2025年的营业收入与归母净利润，并给出出处。">跨公司对比</button>
        </div>
        <button class="submit" id="submit">开始检索</button>
      </div>
      <div id="error"></div>
    </section>
    <section class="result" id="result">
      <article class="panel">
        <div class="panelhead"><h3>回答</h3><span class="mode" id="mode"></span></div>
        <div class="answer" id="answer"></div>
        <div class="method">只有被向量或 BM25 检索到的原文才能进入答案。若年报没有披露相应信息，系统会明确标记“现有材料未覆盖”。
        </div>
      </article>
      <aside class="panel">
        <div class="panelhead"><h3>召回证据</h3><span class="mode" id="sourceCount"></span></div>
        <div class="sources" id="sources"></div>
      </aside>
    </section>
  </main>
  <footer>数据来源：巨潮资讯网上市公司公告 · 仅用于课程实验</footer>
  <script>
    const q=document.getElementById('question'), submit=document.getElementById('submit'), result=document.getElementById('result'), error=document.getElementById('error');
    document.querySelectorAll('.chip').forEach(button=>button.onclick=()=>{q.value=button.dataset.q;q.focus()});
    function escapeHtml(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
    submit.onclick=async()=>{
      if(!q.value.trim()) return;
      error.style.display='none'; result.style.display='none'; submit.disabled=true; submit.innerHTML='<span class="loading"></span>正在取证';
      try{
        const response=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value.trim(),top_k:9})});
        const data=await response.json(); if(!response.ok) throw new Error(data.error||'检索失败');
        document.getElementById('answer').textContent=data.answer; document.getElementById('mode').textContent=data.mode;
        document.getElementById('sourceCount').textContent=`${data.sources.length} 块`;
        document.getElementById('sources').innerHTML=data.sources.map((s,i)=>`<details ${i<2?'open':''}><summary><div class="sourcetop"><span class="cite">${s.citation}</span><div><div class="sourcename">${escapeHtml(s.label)}</div><div class="ranks">Vector #${s.vector_rank||'—'} · BM25 #${s.bm25_rank||'—'} · ${escapeHtml(s.content_type)}</div></div></div></summary><div class="sourcebody">${escapeHtml(s.text)}<br><a href="${s.source_url}" target="_blank" rel="noreferrer">打开公告原文 ↗</a></div></details>`).join('');
        result.style.display='grid'; result.scrollIntoView({behavior:'smooth',block:'start'});
      }catch(e){error.textContent=e.message;error.style.display='block';}
      finally{submit.disabled=false;submit.textContent='开始检索';}
    };
    fetch('/stats.json').then(r=>r.ok?r.json():null).then(s=>{if(s&&s.chunks)document.getElementById('chunkMetric').textContent=s.chunks.toLocaleString('zh-CN')}).catch(()=>{});
    if(new URLSearchParams(location.search).get('demo')==='1') {
      const demoSources=[
        {citation:1,label:'贵州茅台｜2025年年报｜六、其他相关资料｜第6页',rank:'Vector #8 · BM25 #2',text:'营业收入 168,838,102,514.79 元；归属于上市公司股东的净利润 82,320,067,101.68 元；本年比上年增减 -4.53%。'},
        {citation:2,label:'五粮液｜2025年年报｜六、主要会计数据和财务指标｜第7页',rank:'Vector #9 · BM25 #2',text:'营业收入 40,528,509,770.23 元；归属于上市公司股东的净利润 8,954,257,202.51 元；本年比上年增减 -71.89%。'},
        {citation:3,label:'泸州老窖｜2025年年报｜五、其他有关资料｜第7页',rank:'Vector #4 · BM25 #5',text:'营业收入 25,731,010,647.32 元；归属于上市公司股东的净利润 10,830,713,936.14 元；本年比上年增减 -19.61%。'}
      ];
      document.getElementById('answer').textContent='根据 3 家公司 2025 年年报的主要会计数据：\n\n贵州茅台：营业收入 1,688.38 亿元，归母净利润 823.20 亿元，同比分别 -1.21%、-4.53%。[1]\n五粮液：营业收入 405.29 亿元，归母净利润 89.54 亿元，同比分别 -54.55%、-71.89%。[2]\n泸州老窖：营业收入 257.31 亿元，归母净利润 108.31 亿元，同比分别 -17.52%、-19.61%。[3]\n\n三家公司收入和利润均同比下降，五粮液降幅最大；以上数字均来自相应年报主要会计数据页。';
      document.getElementById('mode').textContent='证据模式 · 演示样例'; document.getElementById('sourceCount').textContent='3 块';
      document.getElementById('sources').innerHTML=demoSources.map((s,i)=>`<details ${i<2?'open':''}><summary><div class="sourcetop"><span class="cite">${s.citation}</span><div><div class="sourcename">${s.label}</div><div class="ranks">${s.rank} · text</div></div></div></summary><div class="sourcebody">${s.text}<br><span style="color:#0f766e">打开公告原文 ↗</span></div></details>`).join('');
      result.style.display='grid';
    }
  </script>
</body>
</html>
