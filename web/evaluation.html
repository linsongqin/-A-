<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10题逐题评测记录</title><style>body{margin:0;background:#f5f7f3;color:#142927;font-family:"Microsoft YaHei",Arial,sans-serif}.wrap{width:min(1400px,calc(100% - 32px));margin:24px auto}h1{color:#123b36}p{color:#677875}.tablewrap{overflow:auto;background:#fff;border:1px solid #d9e3df}table{border-collapse:collapse;width:100%;min-width:1200px;font-size:12px}th,td{border-bottom:1px solid #e4ece8;padding:10px;vertical-align:top;text-align:left;line-height:1.55}th{background:#123b36;color:#fff;position:sticky;top:0}.good{color:#16734b;font-weight:700}.partial{color:#97620a;font-weight:700}.bad{color:#a32638;font-weight:700}.small{font-size:11px;color:#677875}</style></head><body><main class="wrap"><h1>10题逐题召回与答案判定记录</h1><p>召回表现与答案表现分开评价；全景题按公司分别取证。详细原始文件保存在 <code>evaluation/results.csv</code>、<code>evaluation/retrieval_details.json</code> 和 <code>evaluation/question_records.md</code>。</p><div id="summary"></div><div class="tablewrap"><table><thead><tr><th>题号/题型</th><th>问题</th><th>召回公司</th><th>Vector Top5</th><th>BM25 Top5</th><th>按公司覆盖</th><th>召回判定</th><th>答案判定</th><th>错误/缺口</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}fetch('/api/evaluation').then(r=>r.json()).then(data=>{const rows=data.questions||[];document.getElementById('summary').innerHTML=`<p>共 ${rows.length} 题；完整召回 ${rows.filter(r=>r.retrieval_hit==='是').length}/10；答案正确 ${rows.filter(r=>r.answer_judgement==='正确').length}/10；跨公司题 ${rows.filter(r=>r.type==='跨公司全景').length} 题。</p>`;document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td><b>${esc(r.id)}</b><br><span class="small">${esc(r.type)}</span></td><td>${esc(r.question)}<br><span class="small">期望：${esc(r.expected_answer)}</span></td><td>${esc(r.recalled_companies)}</td><td>${esc(r.vector_top5)}</td><td>${esc(r.bm25_top5)}</td><td>${esc(r.coverage_by_company)}</td><td class="${r.retrieval_hit==='是'?'good':'partial'}">${esc(r.retrieval_status)}<br><span class="small">命中词：${esc(r.key_terms_hit)}</span></td><td class="${r.answer_judgement==='正确'?'good':r.answer_judgement==='部分正确'?'partial':'bad'}">${esc(r.answer_judgement)}</td><td>${esc(r.judgement_reason)}<br><span class="small">材料提示：${esc(r.missing_material)}</span></td></tr>`).join('')}).catch(e=>document.getElementById('rows').innerHTML=`<tr><td colspan="9">加载失败：${esc(e.message)}</td></tr>`)</script></body></html>
